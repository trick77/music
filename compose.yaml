services:
  music:
    image: ghcr.io/trick77/music:latest
    user: "1000:1000"
    restart: unless-stopped
    environment:
      BACKEND_LISTEN_ADDR: ":8080"
      BACKEND_DB_PATH: "/data/music.db"
      BACKEND_MEDIA_DIR: "/data/media"
      BACKEND_MAX_UPLOAD_MB: "${BACKEND_MAX_UPLOAD_MB:-50}"
      BACKEND_SESSION_SECRET: "${BACKEND_SESSION_SECRET}"
      BACKEND_AUTH_MODE: "${BACKEND_AUTH_MODE:-oidc}"
      # Redirect URL must be https:// so session cookies get the Secure flag.
      BACKEND_OIDC_ISSUER: "${BACKEND_OIDC_ISSUER}"
      BACKEND_OIDC_CLIENT_ID: "${BACKEND_OIDC_CLIENT_ID}"
      BACKEND_OIDC_CLIENT_SECRET: "${BACKEND_OIDC_CLIENT_SECRET}"
      BACKEND_OIDC_REDIRECT_URL: "${BACKEND_OIDC_REDIRECT_URL}"
      BACKEND_OIDC_POST_LOGOUT_REDIRECT_URL: "${BACKEND_OIDC_POST_LOGOUT_REDIRECT_URL}"
      # Optional: restrict the full-access role to one Authentik group (unset = any valid login).
      BACKEND_OIDC_ALLOWED_GROUP: "${BACKEND_OIDC_ALLOWED_GROUP:-}"
      # Image generation (optional; leave the API key empty to disable the Generate button).
      BACKEND_BFL_BASE_URL: "${BACKEND_BFL_BASE_URL:-https://api.bfl.ai/v1}"
      BACKEND_BFL_API_KEY: "${BACKEND_BFL_API_KEY:-}"
      BACKEND_BFL_MODEL: "${BACKEND_BFL_MODEL:-flux-2-klein-4b}"
      BACKEND_BFL_POLL_TIMEOUT: "${BACKEND_BFL_POLL_TIMEOUT:-1m}"
      # Studio: Suno-prompt generation (optional; needs BOTH the chat and Tavily
      # keys to enable). Page-fetch runs in-process (github.com/trick77/webfetch).
      BACKEND_CHAT_BASE_URL: "${BACKEND_CHAT_BASE_URL:-}"
      BACKEND_CHAT_API_KEY: "${BACKEND_CHAT_API_KEY:-}"
      BACKEND_TAVILY_URL: "${BACKEND_TAVILY_URL:-https://mcp.tavily.com/mcp/}"
      BACKEND_TAVILY_API_KEY: "${BACKEND_TAVILY_API_KEY:-}"
      # Karaoke word-timing alignment. Defaults to the bundled `align` sidecar, which
      # starts alongside this service (set to empty to disable karaoke).
      BACKEND_ALIGN_URL: "${BACKEND_ALIGN_URL:-http://align:8000}"
      BACKEND_ALIGN_TIMEOUT: "${BACKEND_ALIGN_TIMEOUT:-10m}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    volumes:
      # Single on-disk bind mount: holds music.db* (WAL) and the media root
      # (media/songs, media/covers, media/fanart + on-disk image cache).
      # Host prep before first run: mkdir -p data && sudo chown -R 1000:1000 data
      - ./data:/data
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.music.rule: Host(`music.trick77.com`)
      traefik.http.routers.music.entrypoints: websecure
      traefik.http.routers.music.tls: "true"
      traefik.http.services.music.loadbalancer.server.port: "8080"

  # Word-timing alignment sidecar (WhisperX + Demucs). Starts by default so karaoke
  # works out of the box; it's heavy (GBs of ML deps + models) — to disable, set
  # BACKEND_ALIGN_URL="" on the music service and don't run this service.
  # Pulls the prebuilt image by default (`docker compose pull`); the build block is a
  # local fallback (`docker compose build align`) when the source is present.
  align:
    image: ghcr.io/trick77/music-align:latest
    build:
      context: ./sidecar/align
      dockerfile: Containerfile   # Docker defaults to "Dockerfile"; ours is Containerfile
    platform: linux/amd64         # several ML deps ship no arm64 wheel (validated amd64)
    restart: unless-stopped
    networks:
      - traefik                  # shared network so `music` can resolve `align` by name
    volumes:
      # Persist downloaded ML models (wav2vec2 align model + htdemucs weights, hundreds
      # of MB) across container recreates. Without this they re-download on every image
      # pull/restart — and a new image is published on every merge to master.
      - align-models:/root/.cache
    # GPU (optional, ~10x faster). Uncomment with the NVIDIA container toolkit installed:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  traefik:
    external: true

volumes:
  # Named volume for the align sidecar's model cache. Persists across `docker compose
  # pull` + container recreate, so the wav2vec2 + htdemucs weights download once
  # instead of on every deploy.
  align-models:
