services:
  music:
    image: ghcr.io/trick77/music:latest
    user: "1000:1000"
    restart: unless-stopped
    ports:
      # Local-only debug publish; Traefik reaches the container over the docker network.
      - "127.0.0.1:8082:8080"
    environment:
      BACKEND_LISTEN_ADDR: ":8080"
      BACKEND_DB_PATH: "/data/music.db"
      BACKEND_MEDIA_DIR: "/data/media"
      BACKEND_MAX_UPLOAD_MB: "${BACKEND_MAX_UPLOAD_MB:-50}"
      BACKEND_SESSION_SECRET: "${BACKEND_SESSION_SECRET}"
      BACKEND_AUTH_MODE: "${BACKEND_AUTH_MODE:-oidc}"
      # Redirect URL must be https:// so session cookies get the Secure flag.
      BACKEND_OIDC_ISSUER: "${BACKEND_OIDC_ISSUER}"
      BACKEND_OIDC_CLIENT_ID: "${BACKEND_OIDC_CLIENT_ID}"
      BACKEND_OIDC_CLIENT_SECRET: "${BACKEND_OIDC_CLIENT_SECRET}"
      BACKEND_OIDC_REDIRECT_URL: "${BACKEND_OIDC_REDIRECT_URL}"
      BACKEND_OIDC_POST_LOGOUT_REDIRECT_URL: "${BACKEND_OIDC_POST_LOGOUT_REDIRECT_URL}"
      # Optional: restrict the full-access role to one Authentik group (unset = any valid login).
      BACKEND_OIDC_ALLOWED_GROUP: "${BACKEND_OIDC_ALLOWED_GROUP:-}"
      # Image generation (optional; leave the API key empty to disable the Generate button).
      BACKEND_BFL_BASE_URL: "${BACKEND_BFL_BASE_URL:-https://api.bfl.ai/v1}"
      BACKEND_BFL_API_KEY: "${BACKEND_BFL_API_KEY:-}"
      BACKEND_BFL_MODEL: "${BACKEND_BFL_MODEL:-flux-2-klein-4b}"
      BACKEND_BFL_POLL_TIMEOUT: "${BACKEND_BFL_POLL_TIMEOUT:-1m}"
      # Studio: Suno-prompt generation (optional; needs BOTH the chat and Tavily
      # keys to enable). The fetch sidecar below is reached over the fetch-mcp network.
      BACKEND_CHAT_BASE_URL: "${BACKEND_CHAT_BASE_URL:-}"
      BACKEND_CHAT_API_KEY: "${BACKEND_CHAT_API_KEY:-}"
      BACKEND_TAVILY_URL: "${BACKEND_TAVILY_URL:-https://mcp.tavily.com/mcp/}"
      BACKEND_TAVILY_API_KEY: "${BACKEND_TAVILY_API_KEY:-}"
      BACKEND_FETCH_MCP_URL: "http://fetch:8090/mcp"
    depends_on:
      fetch:
        # One-shot MCP discovery on the first Studio request → wait for the bridge.
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
    volumes:
      # Single on-disk bind mount: holds music.db* (WAL) and the media root
      # (media/songs, media/covers, media/fanart + on-disk image cache).
      # Host prep before first run: mkdir -p data && sudo chown -R 1000:1000 data
      - ./data:/data
    networks:
      - traefik
      - fetch-mcp
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.music.rule: Host(`music.trick77.com`)
      traefik.http.routers.music.entrypoints: websecure
      traefik.http.routers.music.tls: "true"
      traefik.http.services.music.loadbalancer.server.port: "8080"

  fetch:
    # Lightweight URL/document fetch MCP (mcp-server-fetch bridged to
    # streamable-HTTP by supergateway). Only the music app reaches it, via
    # BACKEND_FETCH_MCP_URL. It is the same generic bridge as ../loom's fetch
    # sidecar; reuse that published image (build ./fetch/Containerfile to publish
    # your own instead). Kept off the traefik network and on a dedicated fetch-mcp
    # network so model-initiated fetches cannot resolve app services by DNS name.
    image: ghcr.io/trick77/loom-fetch:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(8090,'127.0.0.1');s.setTimeout(3000);s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.on('timeout',()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 6
    networks:
      - fetch-mcp
    labels:
      traefik.enable: "false"

networks:
  traefik:
    external: true
  fetch-mcp:
