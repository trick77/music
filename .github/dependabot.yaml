version: 2
updates:
  # Go backend
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Pinned at v0.23.x (see AGENTS.md). v0.24+ may require a newer Go toolchain than the
      # 1.25 this repo targets, so hold major/minor bumps for manual review.
      - dependency-name: github.com/ncruces/go-sqlite3
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # React frontend
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Container base image (backend/Containerfile).
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
