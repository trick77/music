services:
  music:
    build:
      context: .
      dockerfile: backend/Containerfile
    ports:
      - "8080:8080"
    environment:
      BACKEND_SESSION_SECRET: dev-secret-change-me
      BACKEND_AUTH_MODE: dev
      BACKEND_DB_PATH: /data/music.db
      BACKEND_MEDIA_DIR: /data/media
      # Studio (optional): set the chat + Tavily keys in your shell/.env to enable
      # it. Page-fetch runs in-process (github.com/trick77/webfetch).
      BACKEND_CHAT_BASE_URL: "${BACKEND_CHAT_BASE_URL:-}"
      BACKEND_CHAT_API_KEY: "${BACKEND_CHAT_API_KEY:-}"
      BACKEND_TAVILY_URL: "${BACKEND_TAVILY_URL:-https://mcp.tavily.com/mcp/}"
      BACKEND_TAVILY_API_KEY: "${BACKEND_TAVILY_API_KEY:-}"
    volumes:
      - music-data:/data

volumes:
  music-data:
