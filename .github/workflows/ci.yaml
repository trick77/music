name: CI

# Tests run on pull requests (feature branches). Master does not run tests — it
# builds and pushes the image (see release.yaml). No image build happens here.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # fetch-depth: 0 — hack/patch-coverage.sh diffs the branch against the PR
      # base, which needs real history. The default shallow checkout leaves the
      # base ref unresolvable and the gate exits 2.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install diff-cover==10.3.0
      - run: go build ./...
      - run: go vet ./...
      # gofmt is not covered by `go vet`. Two files had already drifted out of
      # gofmt shape before this check existed, so it is worth enforcing rather
      # than trusting editors to do it.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd. Run: gofmt -w ."
            echo "$unformatted"
            exit 1
          fi
      - run: mkdir -p ../coverage
      # The race detector needs cgo; this is independent of the CGO_ENABLED=0
      # invariant used to produce the statically linked shipped binary.
      #
      # -coverpkg=./... attributes coverage across package boundaries: code
      # exercised only by another package's tests is otherwise reported as
      # uncovered, which understates the real number badly.
      - run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=../coverage/backend.out ./...
        env:
          CGO_ENABLED: "1"
      # Go exposes no line metric — `go tool cover` reports statements only — so
      # the line percentage comes from a Cobertura conversion of the profile.
      # That also merges the duplicate blocks -coverpkg emits, one set per test
      # binary, which a naive sum over the raw profile gets badly wrong.
      - run: go run github.com/boumenot/gocover-cobertura@v1.5.0 < ../coverage/backend.out > ../coverage/backend.xml
      # Both gates resolve paths from the repo root, not backend/.
      #
      # The floor gate runs first: when a PR drops the project below the floor
      # the absolute number is the more actionable failure, and reporting it
      # before patch coverage keeps the log readable.
      - run: ./hack/coverage-gate.sh backend
        working-directory: .
      - name: Backend patch coverage
        run: ./hack/patch-coverage.sh "origin/${{ github.base_ref || 'master' }}"
        working-directory: .

  ui:
    name: UI (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      # fetch-depth: 0 — see the backend job.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install diff-cover==10.3.0
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:coverage
      - run: ./hack/coverage-gate.sh ui
        working-directory: .
      - name: UI patch coverage
        run: ./hack/patch-coverage.sh "origin/${{ github.base_ref || 'master' }}"
        working-directory: .

  sidecar:
    name: Align sidecar (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar/align
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The align sidecar's custom logic (word grouping/interpolation, language
      # detection) is unit-tested without the multi-GB ML stack — the tests import
      # only grouping.py/language.py, so pytest + langdetect is all that's needed.
      - run: pip install pytest langdetect==1.0.9
      - run: python -m pytest -q
