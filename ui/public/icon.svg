<!--
  Source for public/icon.svg — the browser tab icon, and nothing else.
  gen-icons.sh ships it as-is; no raster is rendered from it.

  It is a copy of tile.svg with TWO changes: a full-bleed ground rect behind
  everything, and a fill on the frame's own rect. Everything else — the paths,
  the gradient ink, the 2 stroke, the true-bbox centring, the 89.75% frame
  coverage — is tile.svg's and is documented there.

  WHY THIS EXISTS AS ITS OWN SOURCE. tile.svg is the master for the PWA rasters
  (icon-192, icon-512), and those must stay transparent: a launcher composites
  them itself. The tab icon has the opposite need, so the two cannot share a
  file. That is the same reason tile-touch.svg and tile-maskable.svg are
  separate — one glyph, several consumers, each with its own ground.

  WHY IT HAS A GROUND AT ALL. Safari on the desktop draws favicons on a LIGHT
  PLATE in its favourites and bookmarks bars. Measured off a screenshot, dark
  appearance: the plate is rgb(192,192,192) and covers the whole 16x16 square,
  on a bar that is rgb(29,29,28). A transparent orange mark lands on that as an
  orange scribble on a white card, which is what this file fixes.

  The TAB BAR does not do this — same screenshot, the canvas corners came back
  rgb(54,54,54) against a rgb(45,45,44) tab bar, i.e. the bar's own colour. So
  the plate is one surface's behaviour, not Safari's everywhere. Do not "fix" a
  future favicon complaint by assuming it composites onto white; go and measure
  which surface is being looked at. Both readings are in the PR that added the
  ground.

  THE GROUND IS FULL BLEED, as of 2026-08-04. This is a REVERSAL, and the
  reasoning it reverses is kept below because it may well turn out to be the
  better answer.

  Until now only the frame's interior was filled and the canvas corners stayed
  transparent, so what landed in a tab was a rounded chip rather than a square
  tile. That is how the icons which solve this well are built: YouTube's
  favicon, measured, is a fully transparent canvas around an opaque rounded
  rect. Music's frame is already a rect with rx 2, so it only had to be filled,
  not drawn. The stated cost of the chip was that on the favourites bar the
  light plate still shows through the four rounded corners, about a pixel each
  at 16px.

  Filling the whole canvas buys exactly one thing: that corner leak goes away,
  on every surface, unconditionally. It pays for it by being a square tile in
  every tab rather than a chip sitting in one. The chip had previously been
  chosen with both rendered side by side in real Safari; this version exists
  because that call is being re-examined against the shipped article instead of
  against a render. If the tile reads as heavy in the tab bar, the revert is
  small and mechanical: drop the full-bleed rect below, and put gen-icons.sh's
  corner assertion back to alpha 0.

  Note what this does NOT change: the frame's 89.75% coverage. That is a
  separate decision, made one day earlier, which pulled the frame in by a pixel
  at 16px (15.36px of frame to 14.36px) because the chip read as sitting hard
  against the tab's own padding rather than inside it. Ground and coverage are
  independent — do not move both at once and lose which one did the work.

  #33322f, NOT the #1f1f1e the two OS tiles use. Those sit large against a home
  screen; this sits at 16px against a white tab, where #1f1f1e (L* 11.7) reads
  as a black square — the exact look this change is here to avoid, and the
  argument only gets stronger now that the fill runs edge to edge. #33322f
  (L* 20.8) still reads as the app's own dark and leaves the gradient stroke
  (#e08a68 -> #c25f34) plenty of contrast. Change it and gen-icons.sh's ground
  assertions have to move with it.

  The gradient's dark end is the one to watch here, not its light end: #c25f34
  is what the frame's bottom-right corner paints, and that corner is where the
  stroke meets the #33322f ground at the sharpest angle. Rendered at 16px on
  both surfaces it holds. The gradient does not touch the ground, so
  gen-icons.sh's p{0,0} and p{256,96} samples are unaffected by it — one is a
  canvas corner, the other is inside the frame and clear of the headphones.

  The frame's own rect keeps its fill even though the full-bleed rect behind it
  paints the same colour. It is redundant by exactly one attribute, and that is
  deliberate: it keeps the chip one line away.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <linearGradient id="og" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0" stop-color="#e08a68"/>
    <stop offset="1" stop-color="#c25f34"/>
  </linearGradient>
  <rect width="64" height="64" fill="#33322f"/>
  <g transform="translate(-2.4640 -2.4640) scale(2.87200)" fill="none" stroke="url(#og)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2" fill="#33322f"/>
    <g transform="translate(5.8537 5.8537) scale(0.51220)">
      <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>
    </g>
  </g>
</svg>
