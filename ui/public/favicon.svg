<!--
  Music's icon: the lucide "music" note — the exact glyph the app uses in its own
  menus — in the accent orange, on nothing. This is the master. It ships as-is
  (gen-icons.sh copies it to public/favicon.svg) and every raster except the two
  OS tiles is rendered from it.

  The paths are lucide's (ISC), copied rather than imported — nothing loads
  lucide-react to draw a static asset. One departure from how lucide itself
  would render them: stroke is 2.5, not lucide's 2. At 16px a 2-unit stroke
  washes out. It is given in glyph units, so it scales with the glyph and stays
  proportional in the two tiled sources.

  Sized off the glyph's TRUE bbox — x[6-3, 21] y[3, 18+3] grown by half the
  stroke, which comes out 20.5 square and exactly centred on (12,12) — not the
  nominal 24x24 box the paths only partly fill. Scaling by the box is what makes
  a glyph read as a dot at favicon sizes. Here it spans 96% of the canvas, near
  enough edge to edge: a tab already sets the icon in padding of its own, so a
  margin inside the canvas only shrinks the mark for nothing. The two tiled
  sources inset their glyph instead, because there the tile itself is visible.

  TRANSPARENT ON PURPOSE, and safe here in a way it would not be for every mark.
  The browser composites this onto the tab, and a bare note is the good case for
  letting it: the glyph encloses no area, so there is no interior for the tab's
  own colour to sit in and read as a background, and it has no silhouette of its
  own whose corners could leak. That is exactly what bit peeq, whose mark is a
  closed frame — its hollow interior and the corners outside its rounded edge
  both came out near-white on Safari's light tab bar, so peeq's master carries a
  ground. This one has nothing to leak through.

  The cost is contrast rather than colour bleed: #d97757 on a light tab bar is
  about 2.6:1, which is fine for a shape and would not be for text. If that ever
  reads too faint, the fix is a darker orange here (the color-accent token,
  #c6613f), not a ground — a ground is what put a square tile in the tab bar to
  begin with.

  iOS and Android flatten alpha — onto black, and onto the launcher's own fill —
  so apple-touch-icon.png and icon-maskable-512.png are rendered from the opaque
  sources beside this file instead, and gen-icons.sh asserts each raster's ground
  either way. Regenerate them with ui/scripts/gen-icons.sh after touching this
  file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g transform="translate(-3.965 -3.965) scale(2.9971)" fill="none" stroke="#d97757" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V5l12-2v13"/>
    <circle cx="6" cy="18" r="3"/>
    <circle cx="18" cy="16" r="3"/>
  </g>
</svg>
