name: CI

# Tests run on pull requests (feature branches). Master does not run tests — it
# builds and pushes the image (see release.yaml). No image build happens here.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  ui:
    name: UI (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run

  sidecar:
    name: Align sidecar (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar/align
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The align sidecar's custom logic (word grouping/interpolation, language
      # detection) is unit-tested without the multi-GB ML stack — the tests import
      # only grouping.py/language.py, so pytest + langdetect is all that's needed.
      - run: pip install pytest langdetect==1.0.9
      - run: python -m pytest -q
