<!--
  Music's icon: lucide's "headphones" held inside lucide's "square-play" frame.
  This is the master. It ships as-is (gen-icons.sh copies it to
  public/favicon.svg) and every raster except the two OS tiles is rendered from
  it.

  The paths are lucide's (ISC), copied rather than imported — nothing loads
  lucide-react to draw a static asset. Nothing is filled: lucide draws every
  glyph as an outline and both of these stay outlines. peeq fills the wedge
  inside its own copy of this frame, but that is peeq's departure from lucide,
  not one to inherit — a filled shape is a different mark.

  Two glyphs, two jobs. The frame is the holder: a shape with no outline has
  nothing to hold it at 16px, which is the whole reason peeq put its wedge in
  one. The headphones are the mark. Stroke is 2.5 rather than lucide's 2 because
  at 16px a 2-unit line washes out.

  Sized off the frame's TRUE bbox — x[3,21] y[3,21] grown by half the stroke to
  20.5 square, exactly centred on (12,12) — not the nominal 24x24 box the paths
  only partly fill. Scaling by the box is what makes a glyph read as a dot at
  favicon sizes. Here it spans 96% of the canvas, near enough edge to edge: a
  tab already sets the icon in padding of its own, so a margin inside the canvas
  only shrinks the mark for nothing. The two tiled sources inset their glyph
  instead, because there the tile itself is visible.

  The headphones sit at 10.5 units inside the frame's 15.5-unit interior. Note
  what that scale does to the stroke: the inner group is scaled 0.5122, so its
  2.5 stroke paints at about 1.28 units and the headphones read lighter than the
  frame around them. That is the shape as it was chosen, but it is also the
  first thing to check on a real screen — if the mark reads too faint at 16px,
  the lever is an explicit stroke-width on the inner group, not a bigger glyph.

  TRANSPARENT ON PURPOSE. The browser composites this onto the tab, and nothing
  here encloses a surface it would have to fill: both glyphs are outlines, so
  the tab's own colour runs through the frame and between the ear cups alike.
  There is no interior to leak and no silhouette whose corners could, which is
  what a ground would otherwise be protecting against.

  iOS and Android flatten alpha — onto black, and onto the launcher's own fill —
  so apple-touch-icon.png and icon-maskable-512.png are rendered from the opaque
  sources beside this file instead, and gen-icons.sh asserts each raster's ground
  either way. Regenerate the rasters with ui/scripts/gen-icons.sh after touching
  this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g transform="translate(-3.9649 -3.9649) scale(2.99707)" fill="none" stroke="#d97757" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <g transform="translate(5.8537 5.8537) scale(0.51220)">
      <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>
    </g>
  </g>
</svg>
